<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BetterMarmo settings</title><link rel="stylesheet" href="popup.css"><script src="popup.js" defer></script></head>
<body>
<header><img src="../icons/icon.svg" alt="" width="36" height="36"><div><h1>BetterMarmo</h1><p>Your workspace, a little calmer.</p></div></header>
<main>
<label class="setting"><span><strong>Redesign Marmoset</strong><small>Apply the improved interface</small></span><input id="enabled" type="checkbox" role="switch"></label>
<div class="setting"><label for="theme"><strong>Appearance</strong><small>Choose your comfort zone</small></label><select id="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></div>
<label class="setting"><span><strong>Compact tables</strong><small>Fit more rows on your screen</small></span><input id="compact" type="checkbox" role="switch"></label>
<p id="status" role="status" aria-live="polite"></p>
<a class="open" href="https://marmoset.student.cs.uwaterloo.ca/" target="_blank" rel="noopener noreferrer">Open Marmoset <span aria-hidden="true">↗</span></a>
</main>
<footer>Settings stay in this browser.<br>Independent extension · No analytics</footer>
</body></html>
